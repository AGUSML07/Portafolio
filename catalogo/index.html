<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de encargos</title>
<meta name="description" content="Ropa y zapatillas por encargo: Essentials, Supreme, Corteiz, Jordan, Off-White y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --panel:#151517; --panel2:#1d1d20; --line:#2a2a2e;
  --text:#f2f2f0; --muted:#9a9aa0; --accent:#e8ff5a; --accent-ink:#121300;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(12,12,13,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--accent)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 14px 10px 38px;font:inherit;outline:none}
.search input:focus{border-color:#55555c}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.cartbtn{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap;font-weight:600}
.cartbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.cartbtn .n[data-z="1"]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--muted);transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
.chips.cat .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* grid */
.count{color:var(--muted);font-size:13px;padding:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:60px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s}
.card:hover{border-color:#3a3a40}
.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:1;background:#fff;position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;letter-spacing:.02em}
.card .info{padding:10px 12px 12px}
.card .br{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card .nm{font-weight:600;font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--panel);inset:auto 0 0 0;max-height:94vh;border-radius:20px 20px 0 0;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);overscroll-behavior:contain}
.sheet.on{transform:none}
@media(min-width:880px){
  .sheet{inset:50% auto auto 50%;width:min(1040px,94vw);max-height:90vh;border-radius:20px;transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
  .sheet .gal{position:sticky;top:0}
}
.sheet .x{position:sticky;top:10px;float:right;margin:10px 10px -46px 0;z-index:3;width:36px;height:36px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.sheet .body{padding:16px}
.gal{min-width:0}
.main{aspect-ratio:1;background:#fff;border-radius:12px;overflow:hidden;position:relative;touch-action:pan-y}
.main img{width:100%;height:100%;object-fit:contain}
.main .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.main .prev{left:8px}.main .next{right:8px}
.main .pos{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.thumbs button{flex:none;width:58px;height:58px;border-radius:8px;overflow:hidden;background:#fff;border:2px solid transparent;opacity:.7}
.thumbs button[aria-current="true"]{border-color:var(--accent);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.det .br{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-top:14px}
@media(min-width:880px){.det .br{margin-top:6px}}
.det h2{font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:4px 0 0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px;font-weight:600;font-size:14px}
.lbl small{color:var(--muted);font-weight:400;font-size:13px;text-align:right;margin-left:10px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.col{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:center}
.col .sw{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.col .sw img{width:100%;height:100%;object-fit:cover}
.col .sw.noimg{background:var(--panel2);display:grid;place-items:center;font-size:11px;color:var(--muted);padding:4px}
.col span{font-size:11px;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.col[aria-pressed="true"] .sw{border-color:var(--accent)}
.col[aria-pressed="true"] span{color:var(--text)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:50px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:14px}
.size[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text)}
.actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--panel) 30%);padding:18px 0 calc(6px + env(safe-area-inset-bottom));margin-top:12px}
.btn{width:100%;padding:15px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}

/* cart */
.cart .body{display:block}
.cart h2{font-size:20px;margin:6px 0 14px}
.line{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#fff;flex:none}
.line .t{flex:1;min-width:0;font-size:14px}
.line .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t small{color:var(--muted)}
.line .rm{color:var(--muted);padding:8px;font-size:13px}
.cart .btns{display:grid;gap:8px;margin-top:16px}
@media(min-width:880px){.sheet.cart{width:min(560px,94vw)}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:#000;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 16px 40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">Encargos<span>.</span></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar: buzo, Jordan, Corteiz…" autocomplete="off">
      </label>
      <button class="cartbtn" id="cartBtn" aria-label="Mi pedido">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="n" id="cartN" data-z="1">0</span>
      </button>
    </div>
    <div class="chips cat" id="cats"></div>
    <div class="chips" id="brands"></div>
  </div>
</header>

<main class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Productos por encargo. Elegí modelo, color y talle, armá tu pedido y mandalo.</footer>

<div class="overlay" id="ov"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Producto"></section>
<section class="sheet cart" id="cart" role="dialog" aria-modal="true" aria-label="Mi pedido"></section>
<div class="toast" id="toast"></div>

<script src="productos.js"></script>
<script>
(function(){
const P = window.PRODUCTOS || [];
// modo admin: abrir la página con ?admin=1 lo activa en este navegador, ?admin=0 lo apaga
let ADMIN = false;
try {
  const a = new URLSearchParams(location.search).get('admin');
  if(a==='1') localStorage.setItem('adm','1'); else if(a==='0') localStorage.removeItem('adm');
  ADMIN = localStorage.getItem('adm')==='1';
} catch(e){}
const linkOf = id => { const p = P.find(x=>x.id===id); try { return p && p.l ? atob(p.l) : ''; } catch(e){ return ''; } };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = f => 'img/' + f;
const CAT_LABEL = {remera:'Remeras',buzo:'Buzos',pantalon:'Pantalones','pantalón':'Pantalones',bermuda:'Bermudas y shorts',campera:'Camperas',zapatillas:'Zapatillas',musculosa:'Musculosas',top:'Tops',gorra:'Gorras',otro:'Otros'};
const catName = c => CAT_LABEL[c] || (c.charAt(0).toUpperCase()+c.slice(1));

let state = {cat:'', brand:'', q:''};

// chips
function counts(key){ const m = {}; P.forEach(p => m[p[key]] = (m[p[key]]||0)+1); return Object.entries(m).sort((a,b)=> (a[0]==='Otros'||a[0]==='otro') - (b[0]==='Otros'||b[0]==='otro') || b[1]-a[1]); }
function renderChips(){
  const cats = counts('c'), brands = counts('m');
  $('#cats').innerHTML = `<button class="chip" data-cat="" aria-pressed="${!state.cat}">Todo</button>` +
    cats.map(([c]) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${state.cat===c}">${esc(catName(c))}</button>`).join('');
  $('#brands').innerHTML = `<button class="chip" data-brand="" aria-pressed="${!state.brand}">Todas las marcas</button>` +
    brands.map(([b]) => `<button class="chip" data-brand="${esc(b)}" aria-pressed="${state.brand===b}">${esc(b)}</button>`).join('');
}
$('#cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if(!b) return; state.cat = b.dataset.cat; renderChips(); renderGrid(); });
$('#brands').addEventListener('click', e => { const b = e.target.closest('[data-brand]'); if(!b) return; state.brand = b.dataset.brand; renderChips(); renderGrid(); });
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
$('#q').addEventListener('input', e => { state.q = norm(e.target.value.trim()); renderGrid(); });

function sizeRange(t){ if(!t.length) return ''; return t.length===1 ? t[0] : t[0]+'–'+t[t.length-1]; }
function renderGrid(){
  const list = P.filter(p => (!state.cat || p.c===state.cat) && (!state.brand || p.m===state.brand) &&
    (!state.q || norm(p.n+' '+p.m+' '+catName(p.c)+' '+p.col.map(c=>c[0]).join(' ')).includes(state.q)));
  $('#count').textContent = list.length + (list.length===1 ? ' producto' : ' productos');
  $('#grid').innerHTML = list.length ? list.map((p,k) => `
    <button class="card" data-id="${p.id}">
      <div class="ph"><img src="${img(p.i[0])}" alt="" loading="${k<8?'eager':'lazy'}" decoding="async">
        ${p.col.length>1 ? `<span class="badge">${p.col.length} opciones</span>` : ''}</div>
      <div class="info"><div class="br">${esc(p.m)}</div><div class="nm">${esc(p.n)}</div>
        <div class="meta">${esc(catName(p.c))}${p.t.length ? ' · Talles '+esc(sizeRange(p.t)) : ''}</div></div>
    </button>`).join('') : `<div class="empty">No encontramos nada con esa búsqueda.</div>`;
}
$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if(c) openProduct(+c.dataset.id); });

// product sheet
let cur = null;
function openProduct(id, push=true){
  const p = P.find(x => x.id===id); if(!p) return;
  cur = {p, idx:0, col:null, size: p.t.length===1 ? p.t[0] : null};
  const s = $('#sheet');
  s.innerHTML = `
    <button class="x" data-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="body">
      <div class="gal">
        <div class="main" id="main"><img id="mainImg" alt="${esc(p.n)}">
          ${p.i.length>1 ? `<button class="nav prev" data-step="-1" aria-label="Anterior">‹</button><button class="nav next" data-step="1" aria-label="Siguiente">›</button>` : ''}
          <span class="pos" id="pos"></span></div>
        <div class="thumbs" id="thumbs">${p.i.length>1 ? p.i.map((f,k)=>`<button data-k="${k}"><img src="${img(f)}" alt="" loading="lazy"></button>`).join('') : ''}</div>
      </div>
      <div class="det">
        <div class="br">${esc(p.m)} · ${esc(catName(p.c))}</div>
        <h2>${esc(p.n)}</h2>
        ${p.col.length ? `<div class="lbl">Color / modelo <small id="colName">Elegí uno (${p.col.length})</small></div>
        <div class="colors" id="colors">${p.col.map((c,k)=>`<button class="col" data-c="${k}" aria-pressed="false">
            ${c[1]>=0 ? `<div class="sw"><img src="${img(p.i[c[1]])}" alt="" loading="lazy"></div>` : `<div class="sw noimg">${esc(c[0])}</div>`}
            <span>${esc(c[0])}</span></button>`).join('')}</div>` : ''}
        ${p.t.length ? `<div class="lbl">Talle <small id="sizeName">${p.t.length===1 ? esc(p.t[0]) : 'Elegí uno'}</small></div>
        <div class="sizes" id="sizes">${p.t.map(t=>`<button class="size" data-s="${esc(t)}" aria-pressed="${p.t.length===1}">${esc(t)}</button>`).join('')}</div>` : ''}
        <div class="actions"><button class="btn" id="addBtn">Agregar al pedido</button><div class="hint" id="hint"></div>
          ${ADMIN && linkOf(p.id) ? `<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${esc(linkOf(p.id))}" target="_blank" rel="noopener">Abrir link de CSSBuy ↗</a>` : ''}</div>
      </div>
    </div>`;
  showImg(0); validate();
  open(s);
  s.scrollTop = 0;
  if(push) history.pushState({p:id}, '', '#p'+id);
}
function showImg(k){
  const p = cur.p; k = (k + p.i.length) % p.i.length; cur.idx = k;
  $('#mainImg').src = img(p.i[k]);
  const pos = $('#pos'); if(pos) pos.textContent = p.i.length>1 ? (k+1)+' / '+p.i.length : '';
  document.querySelectorAll('#thumbs button').forEach(b => b.setAttribute('aria-current', +b.dataset.k===k));
  const t = document.querySelector(`#thumbs button[data-k="${k}"]`); if(t) t.scrollIntoView({block:'nearest',inline:'nearest'});
}
function validate(){
  const p = cur.p, need = [];
  if(p.col.length && cur.col===null) need.push('color');
  if(p.t.length && !cur.size) need.push('talle');
  $('#addBtn').disabled = need.length>0;
  $('#hint').textContent = need.length ? 'Elegí ' + need.join(' y ') + ' para agregarlo' : '';
}
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if(t.closest('[data-close]')) return closeAll();
  const st = t.closest('[data-step]'); if(st) return showImg(cur.idx + +st.dataset.step);
  const th = t.closest('#thumbs button'); if(th) return showImg(+th.dataset.k);
  const c = t.closest('.col');
  if(c){ cur.col = +c.dataset.c; document.querySelectorAll('.col').forEach(b=>b.setAttribute('aria-pressed', b===c));
    const col = cur.p.col[cur.col]; $('#colName').textContent = col[0]; if(col[1]>=0) showImg(col[1]); validate(); return; }
  const s = t.closest('.size');
  if(s){ cur.size = s.dataset.s; document.querySelectorAll('.size').forEach(b=>b.setAttribute('aria-pressed', b===s)); $('#sizeName').textContent = cur.size; validate(); return; }
  if(t.closest('#addBtn')){ addToCart(); }
});
// swipe on main image
let sx = null;
$('#sheet').addEventListener('touchstart', e => { if(e.target.closest('#main')) sx = e.touches[0].clientX; }, {passive:true});
$('#sheet').addEventListener('touchend', e => { if(sx===null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if(Math.abs(dx)>40) showImg(cur.idx + (dx<0?1:-1)); });

// cart (saved only in this browser)
let cart = [];
try { cart = JSON.parse(localStorage.getItem('pedido')||'[]'); } catch(e){}
const save = () => { try { localStorage.setItem('pedido', JSON.stringify(cart)); } catch(e){} updateN(); };
function updateN(){ const n = $('#cartN'); n.textContent = cart.length; n.dataset.z = cart.length ? '0' : '1'; }
function addToCart(){
  const p = cur.p, col = cur.col!==null ? p.col[cur.col] : null;
  cart.push({id:p.id, n:p.n, col: col ? col[0] : '', t: cur.size || '', img: col && col[1]>=0 ? p.i[col[1]] : p.i[0]});
  save(); toast('Agregado al pedido ✓');
  history.back();
}
function orderText(){
  return 'Hola! Quiero encargar:\n' + cart.map((c,k)=>`${k+1}. ${c.n}${c.col?' — '+c.col:''}${c.t?' — Talle '+c.t:''}`).join('\n');
}
function openCart(push=true){
  const s = $('#cart');
  s.innerHTML = `<button class="x" data-close aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="body"><h2>Mi pedido</h2>
    ${cart.length ? cart.map((c,k)=>`<div class="line"><img src="${img(c.img)}" alt=""><div class="t"><b>${esc(c.n)}</b><small>${esc([c.col, c.t && 'Talle '+c.t].filter(Boolean).join(' · '))}</small></div><button class="rm" data-rm="${k}">Quitar</button></div>`).join('')
      : `<p style="color:var(--muted);padding:20px 0">Todavía no agregaste nada. Tocá un producto, elegí color y talle, y agregalo.</p>`}
    ${cart.length ? `<div class="btns"><button class="btn" id="share">Enviar pedido</button><button class="btn sec" id="copy">Copiar texto del pedido</button>${ADMIN ? `<button class="btn sec" id="copyLinks">Copiar pedido con links (admin)</button>` : ''}<button class="btn sec" id="clear">Vaciar</button></div>` : ''}
    </div>`;
  open(s);
  if(push) history.pushState({cart:1}, '', '#pedido');
}
$('#cartBtn').addEventListener('click', () => openCart());
$('#cart').addEventListener('click', async e => {
  const t = e.target;
  if(t.closest('[data-close]')) return closeAll();
  const rm = t.closest('[data-rm]'); if(rm){ cart.splice(+rm.dataset.rm,1); save(); openCart(false); return; }
  if(t.closest('#clear')){ cart = []; save(); openCart(false); return; }
  if(t.closest('#copy')){ copy(orderText()); return; }
  if(t.closest('#copyLinks')){ copy(cart.map((c,k)=>`${k+1}. ${c.n}${c.col?' — '+c.col:''}${c.t?' — Talle '+c.t:''}\n   ${linkOf(c.id)}`).join('\n')); return; }
  if(t.closest('#share')){
    const text = orderText();
    if(navigator.share){ try { await navigator.share({text}); return; } catch(err){ if(err.name==='AbortError') return; } }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }
});
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('Pedido copiado ✓'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Pedido copiado ✓'); }
}

// open/close + back button
function open(el){ $('#ov').classList.add('on'); el.classList.add('on'); document.body.style.overflow = 'hidden'; }
function hideAll(){ document.querySelectorAll('.sheet.on').forEach(s=>s.classList.remove('on')); $('#ov').classList.remove('on'); document.body.style.overflow = ''; }
function closeAll(){ if(history.state && (history.state.p || history.state.cart)) history.back(); else { hideAll(); history.replaceState(null,'',location.pathname); } }
$('#ov').addEventListener('click', closeAll);
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeAll();
  if(cur && $('#sheet').classList.contains('on')){ if(e.key==='ArrowRight') showImg(cur.idx+1); if(e.key==='ArrowLeft') showImg(cur.idx-1); }
});
function route(){
  hideAll();
  const m = location.hash.match(/^#p(\d+)$/);
  if(m) openProduct(+m[1], false); else if(location.hash==='#pedido') openCart(false);
}
window.addEventListener('popstate', route);

let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 1800); }

renderChips(); renderGrid(); updateN();
if(location.hash){ const h = location.hash; history.replaceState(null,'',location.pathname); history.pushState({p: +(h.match(/^#p(\d+)$/)||[])[1] || null, cart: h==='#pedido'?1:null}, '', h); route(); }
})();
</script>
